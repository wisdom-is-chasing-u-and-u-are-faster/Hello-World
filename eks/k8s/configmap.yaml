apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-eks-html
  namespace: hello
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Deployed in EKS</title>
      <style>
        html, body {
          height: 100%;
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #232f3e 0%, #ff9900 100%);
          color: #ffffff;
        }
        .card {
          text-align: center;
          padding: 60px 80px;
          background: rgba(0, 0, 0, 0.25);
          border-radius: 20px;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .badge {
          font-size: 14px;
          letter-spacing: 2px;
          text-transform: uppercase;
          opacity: 0.85;
        }
        h1 {
          font-size: 40px;
          margin: 16px 0 0 0;
        }
        .icon {
          font-size: 64px;
          margin-bottom: 10px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="icon">&#9832;</div>
        <div class="badge">Amazon EKS &middot; Kubernetes</div>
        <h1>This is Deployed in EKS</h1>
      </div>
    </body>
    </html>
